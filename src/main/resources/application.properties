spring.application.name=nexora-pos

# --- Base de datos ---
# H2 en archivo (no en memoria): los datos sobreviven a que cierres la app.
# AUTO_SERVER=TRUE permite abrir la consola web al mismo tiempo que la app corre.
spring.datasource.url=jdbc:h2:file:./data/pos;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 para inspeccionar tablas en desarrollo: http://localhost:8080/h2-console
# (JDBC URL de arriba, usuario sa, password en blanco)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# El esquema lo define Flyway con migraciones versionadas (src/main/resources/db/migration).
# Hibernate solo valida que las entidades @Entity coincidan con esas tablas; nunca las crea ni modifica.
spring.jpa.hibernate.ddl-auto=validate
# Evita que Hibernate haga consultas "de más" mientras Thymeleaf/Jackson serializan la respuesta.
# Obliga a traer todo lo necesario dentro del @Transactional del servicio, que es donde debe vivir esa lógica.
spring.jpa.open-in-view=false
# Si alguna relación LAZY se llega a recorrer en un ciclo, Hibernate la carga en lotes de 50 (WHERE id IN (...))
# en vez de una consulta por elemento: evita el problema N+1 aunque se nos escape algún caso.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- Tienda ---
# Define qué es "hoy" para el corte de caja.
nexora.zona-horaria=America/Mexico_City

# --- Paginación ---
# Nadie puede pedir ?size=100000 y traerse todo el catálogo de golpe.
spring.data.web.pageable.max-page-size=100

logging.level.org.flywaydb=INFO
